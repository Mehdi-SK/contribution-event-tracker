name: 'Contribution Tracker'
description:
  'Captures GitHub contribution events and emits a standardised payload'
author: 'your-name'

inputs:
  apicuron-url:
    description: APICURON API base URL
    required: false
    default: 'https://apicuron.org/api'
  apicuron-token:
    description:
      Token of a user managing the linked APICURON resource (store as a
      repository secret)
    required: false
  dry-run:
    description: Build and log the event without sending it
    required: false
    default: 'false'

runs:
  using: node24
  main: dist/index.js
